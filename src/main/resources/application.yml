spring:
  application:
    name: spend-guard
  datasource:
    url: jdbc:postgresql://localhost:5433/spendguard
    username: spendguard
    password: spendguard
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    property-naming-strategy: SNAKE_CASE

server:
  port: 8080

spendguard:
  ai:
    provider: api # api | cli
    api-key: ${ANTHROPIC_API_KEY:}
    standard-model: claude-sonnet-5-5
    premium-model: claude-opus-5-5
    standard-escalation-threshold: 20
    premium-escalation-threshold: 10
